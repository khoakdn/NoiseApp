<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TQ5.1</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <!-- Header -->
    <header>
      <h1>Noise Heatmap</h1>
      <div class="nav-links">
        <a href="#" id="navHistory">History</a>
        <a href="#" id="navSettings">Settings</a>
        <span id="lastUpdated">Last updated: --:--</span>
      </div>
    </header>
  
    <!-- Main Content -->
    <main>
      <div class="title">TQ 5.2</div>
  
      <div class="map-container">
        <!-- Placeholder for floor plan or heatmap -->
        <div class="map-placeholder"></div>
      </div>
  
      <div class="legend">
        <div class="legend-item">
          <span class="legend-color quiet"></span>
          <span>Quiet</span>
        </div>
        <div class="legend-item">
          <span class="legend-color moderate"></span>
          <span>Moderate</span>
        </div>
        <div class="legend-item">
          <span class="legend-color loud"></span>
          <span>Loud</span>
        </div>
      </div>
    </main>
  
    <script src="script.js"></script>
  </body>
</html>
